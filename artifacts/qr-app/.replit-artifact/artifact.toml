kind = "web"
previewPath = "/"
title = "QR App Frontend"
version = "1.0.0"
id = "artifacts/qr-app"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23110

[services.development]
run = "pnpm --filter @workspace/qr-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/qr-app", "run", "build" ]
publicDir = "artifacts/qr-app/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23110"
BASE_PATH = "/"
